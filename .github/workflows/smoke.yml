name: Smoke test (deployed site)

# Loads the deployed website and live map in Chromium after every successful
# Vercel production deployment (Vercel reports deployments to GitHub), or on
# demand. Automatic runs check the public production address (repository
# variable SMOKE_URL, default https://uapfinder.vercel.app): the per-deployment
# URLs Vercel reports are behind Vercel's login by default.
on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: Deployment to check
        default: https://uapfinder.vercel.app
        required: true

permissions:
  contents: read

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'Production')
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Check the deployment
        env:
          SMOKE_URL: ${{ inputs.url || vars.SMOKE_URL || 'https://uapfinder.vercel.app' }}
        run: node scripts/smoke.mjs "$SMOKE_URL"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: smoke-screenshots
          path: site/smoke-screenshots/
          retention-days: 14
