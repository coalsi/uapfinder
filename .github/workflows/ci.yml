name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  server:
    name: common + server (Python 3.12)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The Redis and PostGIS integration tests start their own throwaway
      # instances from these binaries (and skip if they are missing).
      - name: Install Redis and PostGIS
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends redis-server postgresql-16-postgis-3
      - name: Install packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -e "./common[test]" -e "./server[test]"
      - name: Test common
        run: .venv/bin/python -m pytest common -q
      - name: Test server
        run: .venv/bin/python -m pytest server/tests -q

  edge:
    name: edge (Python ${{ matrix.python }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        # 3.10 is JetPack 6 (Ubuntu 22.04) on the Jetson.
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install packages
        run: |
          python -m venv .venv
          .venv/bin/pip install -e ./common -e "./edge[test]"
      - name: Test edge
        run: .venv/bin/python -m pytest edge/tests -q

  dashboard:
    name: live map (dashboard)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run build:map
      - run: npm test

  site:
    name: public website
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Install Chromium for the end-to-end tests
        run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
