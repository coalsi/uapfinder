# /etc/chrony/conf.d/skynet-gps.conf, written by SKY-NET deploy/jetson/setup.sh.
#
# GPS time with a PPS pulse. gpsd writes the receiver's serial (NMEA) time to
# shared-memory segment 0; it is late by tens of milliseconds of serial
# latency, so it only numbers the seconds (noselect). The PPS edge on
# @PPS_DEVICE@ marks the exact second and is paired with it ("lock NMEA").
# Expect offsets of microseconds: chronyc sources -v should show "#* PPS".
refclock SHM 0 refid NMEA offset 0.0 delay 0.2 noselect
refclock PPS @PPS_DEVICE@ lock NMEA refid PPS prefer poll 4 trust
