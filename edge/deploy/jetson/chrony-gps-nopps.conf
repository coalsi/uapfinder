# /etc/chrony/conf.d/skynet-gps.conf, written by SKY-NET deploy/jetson/setup.sh.
#
# No PPS input was found. gpsd's serial (NMEA) time in shared-memory
# segment 0 is late by a receiver-specific tens of milliseconds, so it is
# weighted down (delay) and mainly matters when no network NTP server is
# reachable. Calibrate "offset" against NTP (chronyc sourcestats) and add a
# PPS input for triangulation-grade timing.
refclock SHM 0 refid NMEA offset 0.1 delay 0.2 precision 1e-1
