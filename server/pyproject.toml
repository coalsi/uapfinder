[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "skynet-server"
version = "0.1.0"
description = "SKY-NET ingestion, stereo matchmaking, 3D tracking, persistence and HTTP API"
requires-python = ">=3.10"
dependencies = [
    "skynet-common",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "numpy>=1.24",
    "orjson>=3.10",
    "redis[hiredis]>=5.0",
    "asyncpg>=0.29",
    "httpx>=0.27",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
skynet-server = "skynet_server.cli:main"

[tool.setuptools.packages.find]
include = ["skynet_server*"]

[tool.setuptools.package-data]
skynet_server = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
